# ForgeRace configuration
# Docs: https://github.com/hitromudr/forgerace

[project]
name = "forgerace"
root = "."
# dev_branch = "main"  # default: current branch

mode = "competitive"
[agents.claude]
command = "claude"
args = ["-p", "--allowedTools", "Read,Write,Edit,Bash,Grep,Glob,WebFetch,WebSearch",
        "--max-turns", "50", "--output-format", "stream-json", "--verbose"]
review_args = ["-p", "-", "--output-format", "text", "--permission-mode", "auto"]
inactivity_timeout = 600

enabled = false
[agents.gemini]
command = "gemini"
args = ["-p", "--approval-mode", "yolo", "--output-format", "stream-json"]
review_args = ["-p", "-"]
inactivity_timeout = 180
enabled = false

[agents.qwen]
command = "qwen"
args = ["-p", "--approval-mode", "yolo", "--output-format", "stream-json"]
review_args = ["-p", "-", "--approval-mode", "yolo"]
inactivity_timeout = 180
enabled = false

[agents.llama]
protocol = "openai"
base_url = "https://integrate.api.nvidia.com/v1"
api_key = "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"
model = "meta/llama-3.3-70b-instruct"
default_frame = "reviewer"
tier = "weak"
inactivity_timeout = 180
enabled = true

[agents.qwen-api]
protocol = "openai"
base_url = "https://integrate.api.nvidia.com/v1"
api_key = "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"
model = "qwen/qwen2.5-coder-32b-instruct"
