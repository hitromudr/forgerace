# Aider-based coding agents (nvidia free API)
# Aider agents — через LiteLLM proxy (localhost:4000)
# aider-llama disabled: llama-70b зацикливается при кодинге
[agents.aider-llama]
command = "aider"
args = ["--openai-api-base", "http://127.0.0.1:4000/v1",
        "--openai-api-key", "fr-local-dev",
        "--model", "openai/llama-70b",
        "--edit-format", "whole",
        "--message-file", "/dev/stdin",
        "--yes-always", "--no-auto-commits", "--no-pretty", "--no-stream",
        "--no-show-model-warnings", "--no-gitignore",
        "--no-browser", "--no-analytics", "--no-check-update"]
protocol = "text"
prompt_stdin = true
inactivity_timeout = 300
enabled = false
[agents.aider-llama.env]
BROWSER = "true"
no_proxy = "127.0.0.1,localhost"
NO_PROXY = "127.0.0.1,localhost"
HTTP_PROXY = ""
HTTPS_PROXY = ""
ALL_PROXY = ""

